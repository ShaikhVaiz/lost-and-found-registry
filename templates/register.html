{% extends "base.html" %}

{% block title %}Create Account - Lost &amp; Found Hub{% endblock %}

{% block content %}
<div class="auth-box">
  <div class="auth-header">
    <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📜</div>
    <h1>Create Citizen Account</h1>
    <p>Public Lost-and-Found Registry &bull; Register to submit reports &amp; match alerts</p>
  </div>

  <form method="POST" action="{{ url_for('register') }}">
    <div class="form-group">
      <label class="form-label" for="name">Full Name *</label>
      <input 
        type="text" 
        id="name" 
        name="name" 
        class="form-control" 
        placeholder="e.g. John Doe" 
        value="{{ form_data.get('name', '') }}" 
        required
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Institutional / Personal Email *</label>
      <input 
        type="email" 
        id="email" 
        name="email" 
        class="form-control" 
        placeholder="citizen@example.com" 
        value="{{ form_data.get('email', '') }}" 
        required
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="phone">Contact Phone Number (Optional)</label>
      <input 
        type="text" 
        id="phone" 
        name="phone" 
        class="form-control" 
        placeholder="+91 9876543210" 
        value="{{ form_data.get('phone', '') }}"
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="role">Registration Role *</label>
      <select id="role" name="role" class="form-select">
        <option value="user" {% if form_data.get('role') != 'admin' %}selected{% endif %}>Citizen / Reporter Account</option>
        <option value="admin" {% if form_data.get('role') == 'admin' %}selected{% endif %}>Institutional Administrator Account</option>
      </select>
    </div>

    <div class="form-group" style="margin-bottom: 1.75rem;">
      <label class="form-label" for="password">Password (at least 6 characters) *</label>
      <input 
        type="password" 
        id="password" 
        name="password" 
        class="form-control" 
        placeholder="••••••••" 
        required
      >
    </div>

    <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.85rem; font-size: 1rem;">
      Complete Registration &rarr;
    </button>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px dashed var(--border-vintage); font-size: 0.9rem; color: var(--text-muted);">
      Already have an account? 
      <a href="{{ url_for('login') }}" style="color: var(--chestnut); font-weight: 700; text-decoration: underline;">
        Sign in here
      </a>
    </div>
  </form>
</div>
{% endblock %}
